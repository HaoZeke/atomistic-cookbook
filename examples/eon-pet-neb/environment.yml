channels:
  - metatensor
  - conda-forge
  - https://repo.prefix.dev/rg-forge
dependencies:
  # Class-first client only: pyeonclient + eon-schema. No eon-akmc / full eon tree.
  - ira
  - python=3.13
  - pip
  - uv
  - pip:
    - torch>=2.9,<2.10
    - ase>=3.23
    - matplotlib
    # PET-MAD / metatomic floor for pyeonclient metatomic backend.
    - metatrain>=2026.3.1
    - requests
    - metatomic-ase
    - pyeonclient>=2.16.0
    - eon-schema>=0.2.0
    # Notebook CON I/O + plots (rgpycrumbs uses eon-schema, not eon-akmc).
    - "readcon>=0.13.1"
    - "rgpycrumbs>=1.9.16,<2"
    - atomistic-cookbook-utils >=0.1,<0.2
