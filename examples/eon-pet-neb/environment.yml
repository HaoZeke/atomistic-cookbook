channels:
  - metatensor
  - conda-forge
  - https://repo.prefix.dev/rg-forge
dependencies:
  # Class-first client only: pyeonclient + eon-schema. No eon-akmc / full eon tree.
  # pyeonclient is the 0.x PyPI line (not conda eon 2.16 branding).
  - ira
  - python=3.13
  - pip
  - uv
  - pip:
    - torch>=2.9,<2.10
    - ase>=3.23
    - matplotlib
    # PET-MAD / metatomic floor; eOn pot uses ase_metatomic (MetatomicCalculator).
    - metatrain>=2026.3.1
    - requests
    - metatomic-ase
    # PyPI pyeonclient 0.x (wheels: built_with_rgpot, not fat METATOMIC).
    - pyeonclient>=0.3.4
    - eon-schema>=0.2.1
    # Notebook CON I/O + plots (rgpycrumbs uses eon-schema, not eon-akmc).
    - "readcon>=0.13.1"
    - "rgpycrumbs>=1.9.16,<2"
    - atomistic-cookbook-utils >=0.1,<0.2
